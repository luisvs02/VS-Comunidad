<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Panel</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#64727f;--ac:#0f766e;--acx:#fff;--bd:#dde3e8;--me:#d9f3ee;--danger:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--tx:#e8eef3;--mut:#93a1ad;--ac:#2cb5a6;--acx:#06201d;--bd:#2a3844;--me:#17433e;--danger:#ff7b6b}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.hidden{display:none!important}
.screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:420px}
.screen .card{padding:22px}
h1,h2,h3{margin:0 0 8px}
.muted{color:var(--mut);font-size:.9rem}
input,textarea,select{width:100%;padding:11px 12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{resize:vertical;min-height:120px}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.dan{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--ac);padding:10px 0;font:inherit;cursor:pointer;width:100%}
.err{color:var(--danger);min-height:1.2em;font-size:.9rem}
#main{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font-size:1.1rem;margin:0}
#views{flex:1;overflow:auto;padding:12px;position:relative}
.view{display:none;max-width:720px;margin:0 auto}
.view.on{display:block}
#v-chat.on{display:flex;flex-direction:column;height:100%}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 2px;color:var(--mut);font:inherit;font-size:.7rem;cursor:pointer;position:relative}
nav button span{display:block;font-size:1.3rem}
nav button.on{color:var(--ac);font-weight:700}
.badge{position:absolute;top:2px;left:55%;background:var(--danger);color:#fff;border-radius:9px;font-size:.65rem;padding:0 5px}
.stack>*{margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.row>input{margin:0}
.big{font-size:3rem;font-weight:700;line-height:1}
.fc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:.8rem}
.fc div{background:var(--bg);border-radius:10px;padding:8px 2px}
.seg{display:flex;gap:6px}
.seg button{flex:1}
.news img{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.news a.t{color:var(--tx);font-weight:700;text-decoration:none}
#chatList{flex:1;overflow:auto;padding:4px 2px}
.msg{display:flex;margin:6px 0}
.msg.me{justify-content:flex-end}
.bub{max-width:80%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:7px 10px;word-wrap:break-word}
.me .bub{background:var(--me)}
.bub b{display:block;font-size:.75rem;color:var(--ac)}
.bub img{display:block;max-width:100%;border-radius:8px;margin-top:2px}
.bub small{display:block;color:var(--mut);font-size:.7rem;text-align:right}
.bub small button{background:none;border:0;padding:0;cursor:pointer}
#picker{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:6px}
#pickGrid{display:grid;gap:6px;max-height:210px;overflow:auto;margin-top:6px}
#pickGrid.emo{grid-template-columns:repeat(8,1fr)}
#pickGrid.gif{grid-template-columns:repeat(3,1fr)}
#pickGrid button{background:none;border:0;cursor:pointer;padding:2px;font-size:1.5rem}
#pickGrid img{width:100%;height:90px;object-fit:cover;border-radius:8px}
.composer{display:flex;gap:6px;align-items:center;padding-top:6px}
.composer input{margin:0}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px;cursor:pointer;font-size:1.1rem}
.tag{display:inline-block;background:var(--bg);border-radius:8px;padding:1px 8px;font-size:.75rem;color:var(--mut)}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}
.chk input{width:auto;margin:0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
#sheet .card{border-radius:16px 16px 0 0;max-width:520px}
#sheetLinks{display:grid;gap:8px;margin:10px 0}
#sheetLinks a,#sheetLinks button{display:block;text-align:center;padding:11px;border-radius:10px;border:1px solid var(--bd);color:var(--tx);text-decoration:none;background:var(--bg);font:inherit;cursor:pointer}
</style>
</head>
<body>

<div id="auth" class="screen hidden">
  <div class="card">
    <h1>Mi Panel</h1>
    <p class="muted">Clima, noticias, chat y notas en un solo lugar.</p>
    <form id="authForm">
      <input id="aName" class="reg hidden" placeholder="Tu nombre" autocomplete="name">
      <input id="aEmail" type="email" placeholder="Correo" required autocomplete="email">
      <input id="aPass" type="password" placeholder="Contraseña (mín. 6)" required minlength="6" autocomplete="current-password">
      <p class="err" id="authMsg"></p>
      <button class="btn" id="aSubmit" style="width:100%">Entrar</button>
    </form>
    <button class="link" id="aToggle" type="button">¿No tenés cuenta? Solicitar acceso</button>
  </div>
</div>

<div id="pending" class="screen hidden">
  <div class="card">
    <h2 id="pendTitle">Acceso en revisión</h2>
    <p class="muted" id="pendTxt"></p>
    <button class="btn sec" data-a="logout">Salir</button>
  </div>
</div>

<div id="main" class="hidden">
  <header>
    <h1 id="hTitle">Mi Panel</h1>
    <div class="row"><span class="muted" id="hUser"></span><button class="btn sec sm" data-a="logout">Salir</button></div>
  </header>
  <div id="views">

    <section class="view stack" id="v-weather">
      <div class="card" id="weatherBox">Cargando…</div>
      <button class="btn sec" data-a="weather">Actualizar clima</button>
    </section>

    <section class="view stack" id="v-news">
      <div class="seg">
        <button class="btn sm" data-a="scope" data-s="local" id="sLocal">Locales</button>
        <button class="btn sm sec" data-a="scope" data-s="world" id="sWorld">Internacionales</button>
      </div>
      <form class="row" id="newsForm">
        <input id="newsQ" placeholder="Buscar noticias (vacío = titulares)">
        <button class="btn">Buscar</button>
      </form>
      <div id="newsList" class="stack"></div>
    </section>

    <section class="view" id="v-chat">
      <div id="chatList"></div>
      <div id="picker" class="hidden">
        <div class="seg">
          <button class="btn sm" data-a="ptab" data-k="emo">😀 Emojis</button>
          <button class="btn sm sec" data-a="ptab" data-k="gif">GIFs</button>
          <button class="btn sm sec" data-a="ptab" data-k="memes">Memes</button>
        </div>
        <form class="row hidden" id="pickForm" style="margin-top:6px">
          <input id="pickQ" placeholder="Buscar…">
          <button class="btn sm">Ir</button>
        </form>
        <div id="pickGrid" class="emo"></div>
      </div>
      <form class="composer" id="chatForm">
        <button type="button" class="ib" data-a="picker" title="Emojis, GIFs y memes">😀</button>
        <button type="button" class="ib" data-a="imgurl" title="Imagen por enlace">🖼️</button>
        <input id="chatIn" placeholder="Escribí un mensaje" autocomplete="off">
        <button class="btn">➤</button>
      </form>
    </section>

    <section class="view stack" id="v-notices"></section>
    <section class="view stack" id="v-notes"></section>
    <section class="view stack" id="v-admin"></section>
  </div>
  <nav id="tabs"></nav>
</div>

<div id="sheet" class="hidden">
  <div class="card">
    <h3>Compartir</h3>
    <p class="muted" id="sheetTitle"></p>
    <div id="sheetLinks"></div>
    <button class="btn sec" style="width:100%" data-a="closesheet">Cerrar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, updateDoc, deleteDoc, addDoc, collection, query, where, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ============ CONFIGURACIÓN (completar) ============ */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyBeFHcTx8XnXpibQ8-fKwB_rkP7I8lQXuU",
    authDomain: "vs-comunidad.firebaseapp.com",
    projectId: "vs-comunidad",
    storageBucket: "vs-comunidad.firebasestorage.app",
    messagingSenderId: "581653195463",
    appId: "1:581653195463:web:b5b560cef9a475e3136ce2",
    measurementId: "G-6657T3N0XE"
  },
  GNEWS_KEY: "", 1f39062cde35feb61c521ab982c844af
  GIPHY_KEY: ""    // https://developers.giphy.com (gratis)
};
/* ==================================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';

if (!CONFIG.firebase.apiKey || CONFIG.firebase.apiKey.startsWith('PEGAR')) {
  document.body.innerHTML = '<div class="screen"><div class="card"><h1>Falta configurar Firebase</h1><p class="muted">Completá el objeto CONFIG al inicio del script en index.html (ver README.md).</p></div></div>';
  throw new Error('Firebase sin configurar');
}

const app = initializeApp(CONFIG.firebase);
const auth = getAuth(app);
const db = getFirestore(app);

const state = { user: null, me: null, started: false, tab: 'weather', country: '', coords: null,
  newsScope: 'local', articles: [], notices: [], allNotices: [], users: [], notes: [], editing: null,
  seenKey: '', pickKind: 'emo', chatFirst: true };
let unsubs = [], unsubUser = null;

/* ---------- Pantallas ---------- */
function show(id) { ['auth', 'pending', 'main'].forEach(s => $('#' + s).classList.toggle('hidden', s !== id)); }

/* ---------- Autenticación ---------- */
let regMode = false;
function setMode(r) {
  regMode = r;
  document.querySelectorAll('.reg').forEach(el => el.classList.toggle('hidden', !r));
  $('#aSubmit').textContent = r ? 'Solicitar acceso' : 'Entrar';
  $('#aToggle').textContent = r ? 'Ya tengo cuenta: entrar' : '¿No tenés cuenta? Solicitar acceso';
  $('#aPass').autocomplete = r ? 'new-password' : 'current-password';
  $('#authMsg').textContent = '';
}
$('#aToggle').onclick = () => setMode(!regMode);
const errMsg = e => ({
  'auth/invalid-credential': 'Correo o contraseña incorrectos.',
  'auth/wrong-password': 'Correo o contraseña incorrectos.',
  'auth/user-not-found': 'Correo o contraseña incorrectos.',
  'auth/email-already-in-use': 'Ese correo ya está registrado.',
  'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
  'auth/invalid-email': 'Correo inválido.',
  'auth/too-many-requests': 'Demasiados intentos. Probá más tarde.',
  'name': 'Ingresá tu nombre.'
}[e.code] || 'No se pudo completar. Revisá los datos e intentá de nuevo.');

$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const email = $('#aEmail').value.trim(), pass = $('#aPass').value, name = $('#aName').value.trim();
  $('#aSubmit').disabled = true; $('#authMsg').textContent = '';
  try {
    if (regMode) {
      if (!name) throw { code: 'name' };
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, 'users', c.user.uid), { name, email, status: 'pending', role: 'user', createdAt: serverTimestamp() });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (err) { $('#authMsg').textContent = errMsg(err); }
  $('#aSubmit').disabled = false;
};

function stopApp() { unsubs.forEach(f => f()); unsubs = []; state.started = false; state.chatFirst = true; }

onAuthStateChanged(auth, user => {
  stopApp(); if (unsubUser) { unsubUser(); unsubUser = null; }
  state.user = user; state.me = null;
  if (!user) { show('auth'); return; }
  unsubUser = onSnapshot(doc(db, 'users', user.uid), snap => {
    const d = snap.exists() ? snap.data() : null;
    state.me = d;
    if (d && d.status === 'approved') {
      if (!state.started) startApp();
    } else {
      stopApp();
      const rej = d && d.status === 'rejected';
      $('#pendTitle').textContent = rej ? 'Acceso no autorizado' : 'Acceso en revisión';
      $('#pendTxt').textContent = rej ? 'El administrador no aprobó esta cuenta.' : 'Tu solicitud fue enviada. Cuando el administrador la apruebe vas a poder entrar.';
      show('pending');
    }
  }, err => console.error(err));
});

/* ---------- Inicio de la app ---------- */
const TABS = [
  { id: 'weather', ic: '⛅', t: 'Clima' }, { id: 'news', ic: '📰', t: 'Noticias' },
  { id: 'chat', ic: '💬', t: 'Chat' }, { id: 'notices', ic: '📣', t: 'Avisos' },
  { id: 'notes', ic: '📝', t: 'Notas' }, { id: 'admin', ic: '🛠️', t: 'Admin', admin: true }
];
const isAdmin = () => state.me && state.me.role === 'admin';

function startApp() {
  state.started = true;
  state.seenKey = 'seenNotices_' + state.user.uid;
  $('#hUser').textContent = state.me.name || '';
  $('#tabs').innerHTML = TABS.filter(t => !t.admin || isAdmin())
    .map(t => `<button data-a="tab" data-t="${t.id}" id="tab-${t.id}"><span>${t.ic}</span>${t.t}</button>`).join('');
  show('main');
  subChat(); subNotices(); subNotes();
  if (isAdmin()) subAdmin();
  setTab(state.tab);
  loadWeather();
}

function setTab(id) {
  if (id === 'admin' && !isAdmin()) id = 'weather';
  state.tab = id;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + id));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.id === 'tab-' + id));
  if (id === 'chat') { const l = $('#chatList'); l.scrollTop = l.scrollHeight; }
  if (id === 'news' && !state.articles.length) loadNews();
  if (id === 'notices') { try { localStorage.setItem(state.seenKey, String(Date.now())); } catch (e) {} renderBadge(); }
}

/* ---------- Clima ---------- */
const WMO = { 0: ['☀️', 'Despejado'], 1: ['🌤️', 'Mayormente despejado'], 2: ['⛅', 'Parcialmente nublado'], 3: ['☁️', 'Nublado'],
  45: ['🌫️', 'Niebla'], 48: ['🌫️', 'Niebla con escarcha'], 51: ['🌦️', 'Llovizna ligera'], 53: ['🌦️', 'Llovizna'], 55: ['🌧️', 'Llovizna intensa'],
  61: ['🌧️', 'Lluvia ligera'], 63: ['🌧️', 'Lluvia'], 65: ['🌧️', 'Lluvia fuerte'], 71: ['🌨️', 'Nieve ligera'], 73: ['🌨️', 'Nieve'], 75: ['❄️', 'Nieve fuerte'],
  80: ['🌦️', 'Chubascos'], 81: ['🌧️', 'Chubascos fuertes'], 82: ['⛈️', 'Chubascos violentos'], 95: ['⛈️', 'Tormenta'], 96: ['⛈️', 'Tormenta con granizo'], 99: ['⛈️', 'Tormenta fuerte con granizo'] };
const wmo = c => WMO[c] || ['🌡️', 'Variable'];

let locPromise = null;
function getLocation() {
  if (state.coords) return Promise.resolve(state.coords);
  if (locPromise) return locPromise;
  locPromise = new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Sin geolocalización'));
    navigator.geolocation.getCurrentPosition(p => { state.coords = { lat: p.coords.latitude, lon: p.coords.longitude }; res(state.coords); },
      e => { locPromise = null; rej(e); }, { timeout: 12000, maximumAge: 600000 });
  });
  return locPromise;
}

async function loadWeather() {
  const box = $('#weatherBox');
  box.textContent = 'Obteniendo tu ubicación…';
  try {
    const { lat, lon } = await getLocation();
    const [w, g] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5`).then(r => r.json()),
      fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`).then(r => r.json()).catch(() => ({}))
    ]);
    state.country = g.countryCode || state.country;
    const place = [g.city || g.locality, g.countryName].filter(Boolean).join(', ') || 'Tu ubicación';
    const c = w.current, d = w.daily, [ic, desc] = wmo(c.weather_code);
    const days = d.time.map((t, i) => {
      const nm = new Date(t + 'T12:00:00').toLocaleDateString('es', { weekday: 'short' });
      return `<div><b>${esc(nm)}</b><br>${wmo(d.weather_code[i])[0]}<br>${Math.round(d.temperature_2m_max[i])}°<br><span class="muted">${Math.round(d.temperature_2m_min[i])}°</span><br><span class="muted">💧${d.precipitation_probability_max[i] ?? 0}%</span></div>`;
    }).join('');
    box.innerHTML = `<div class="muted">📍 ${esc(place)}</div>
      <div class="row" style="margin:8px 0"><span class="big">${Math.round(c.temperature_2m)}°</span><span style="font-size:2.6rem">${ic}</span></div>
      <div>${esc(desc)} · sensación ${Math.round(c.apparent_temperature)}°</div>
      <div class="muted" style="margin:6px 0 12px">Humedad ${c.relative_humidity_2m}% · Viento ${Math.round(c.wind_speed_10m)} km/h</div>
      <div class="fc">${days}</div>`;
  } catch (e) {
    box.innerHTML = '<b>No pude obtener tu ubicación.</b><p class="muted">Permití el acceso a la ubicación en el navegador y tocá "Actualizar clima".</p>';
  }
}

/* ---------- Noticias ---------- */
async function loadNews() {
  const list = $('#newsList');
  if (!CONFIG.GNEWS_KEY) { list.innerHTML = '<div class="card">Falta la clave de GNews en CONFIG (ver README.md).</div>'; return; }
  list.innerHTML = '<div class="card">Buscando noticias…</div>';
  if (state.newsScope === 'local' && !state.country) { try { await loadWeather(); } catch (e) {} }
  const q = $('#newsQ').value.trim();
  const p = new URLSearchParams({ apikey: CONFIG.GNEWS_KEY, lang: 'es', max: '10' });
  if (state.newsScope === 'local' && state.country) p.set('country', state.country.toLowerCase());
  let url;
  if (q) { p.set('q', q); url = 'https://gnews.io/api/v4/search?' + p; }
  else { p.set('category', 'general'); url = 'https://gnews.io/api/v4/top-headlines?' + p; }
  try {
    const r = await fetch(url), j = await r.json();
    if (!r.ok) throw new Error((j.errors || ['Error']).join(' '));
    state.articles = j.articles || [];
    const note = (state.newsScope === 'local' && !state.country) ? '<div class="muted">Sin ubicación: se muestran titulares generales.</div>' : '';
    list.innerHTML = note + (state.articles.length ? state.articles.map((a, i) => {
      const img = safeUrl(a.image);
      const dt = a.publishedAt ? new Date(a.publishedAt).toLocaleDateString('es', { day: 'numeric', month: 'short' }) : '';
      return `<div class="card news">${img ? `<img src="${esc(img)}" loading="lazy" alt="">` : ''}
        <a class="t" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">${esc(a.title)}</a>
        <p class="muted">${esc(a.description || '')}</p>
        <div class="row" style="justify-content:space-between"><span class="tag">${esc(a.source?.name || '')} · ${esc(dt)}</span>
        <button class="btn sec sm" data-a="share" data-i="${i}">Compartir</button></div></div>`;
    }).join('') : '<div class="card">Sin resultados.</div>');
  } catch (e) {
    list.innerHTML = `<div class="card">No se pudieron cargar las noticias.<p class="muted">${esc(e.message)}</p></div>`;
  }
}
$('#newsForm').onsubmit = e => { e.preventDefault(); loadNews(); };

/* ---------- Compartir ---------- */
async function share(title, url) {
  if (navigator.share) {
    try { await navigator.share({ title, text: title, url }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const t = encodeURIComponent(title), u = encodeURIComponent(url);
  $('#sheetTitle').textContent = title;
  $('#sheetLinks').innerHTML = `
    <a href="https://wa.me/?text=${t}%20${u}" target="_blank" rel="noopener">WhatsApp</a>
    <a href="https://t.me/share/url?url=${u}&text=${t}" target="_blank" rel="noopener">Telegram</a>
    <a href="https://www.facebook.com/sharer/sharer.php?u=${u}" target="_blank" rel="noopener">Facebook</a>
    <a href="https://twitter.com/intent/tweet?text=${t}&url=${u}" target="_blank" rel="noopener">X (Twitter)</a>
    <button data-a="copy" data-url="${esc(url)}">Copiar enlace</button>`;
  $('#sheet').classList.remove('hidden');
}

/* ---------- Chat ---------- */
const EMOJIS = Array.from('😀😃😄😁😆😅😂🤣😊😇🙂😉😍🥰😘😎🤩🥳😏😒😞😔😢😭😤😡🤯😱😨😅🤔🙄😴🤤🤗🤭🫡👍👎👏🙌🙏💪👀🔥✨💯🎉🎂🎁❤️🧡💛💚💙💜🖤💔☀️🌙⭐🌈☕🍺🍕🍔🍩⚽🎮🎵🚗✈️🏠📍📞💡✅❌⚠️❓');
const GIPHY_ERR = 'Falta la clave de Giphy en CONFIG (ver README.md).';

function subChat() {
  const q = query(collection(db, 'messages'), orderBy('createdAt', 'desc'), limit(100));
  unsubs.push(onSnapshot(q, snap => {
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse();
    const box = $('#chatList');
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
    box.innerHTML = docs.map(m => {
      const mine = m.uid === state.user.uid;
      const t = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }) : '';
      const body = (m.type === 'gif' || m.type === 'img') ? `<img src="${esc(safeUrl(m.url))}" loading="lazy" alt="">` : `<span>${esc(m.text)}</span>`;
      const can = mine || isAdmin();
      return `<div class="msg ${mine ? 'me' : ''}"><div class="bub">${mine ? '' : `<b>${esc(m.name)}</b>`}${body}<small>${t}${can ? ` <button data-a="delmsg" data-id="${m.id}" title="Borrar">🗑</button>` : ''}</small></div></div>`;
    }).join('') || '<p class="muted" style="text-align:center">Todavía no hay mensajes. ¡Escribí el primero!</p>';
    if (atBottom || state.chatFirst) { box.scrollTop = box.scrollHeight; state.chatFirst = false; }
  }, e => console.error(e)));
}

async function sendMsg(data) {
  await addDoc(collection(db, 'messages'), { uid: state.user.uid, name: state.me.name, createdAt: serverTimestamp(), ...data });
}
$('#chatForm').onsubmit = async e => {
  e.preventDefault();
  const t = $('#chatIn').value.trim();
  if (!t) return;
  $('#chatIn').value = '';
  try { await sendMsg({ type: 'text', text: t.slice(0, 1000) }); } catch (err) { alert('No se pudo enviar.'); }
};

function renderPicker() {
  const g = $('#pickGrid');
  document.querySelectorAll('[data-a=ptab]').forEach(b => b.classList.toggle('sec', b.dataset.k !== state.pickKind));
  $('#pickForm').classList.toggle('hidden', state.pickKind === 'emo');
  if (state.pickKind === 'emo') {
    g.className = 'emo';
    g.innerHTML = EMOJIS.map(e => `<button type="button" data-a="emoji" data-e="${e}">${e}</button>`).join('');
  } else { loadGifs(); }
}
async function loadGifs() {
  const g = $('#pickGrid');
  if (!CONFIG.GIPHY_KEY) { g.className = ''; g.innerHTML = `<p class="muted">${GIPHY_ERR}</p>`; return; }
  g.className = 'gif'; g.innerHTML = '<p class="muted">Cargando…</p>';
  const q = $('#pickQ').value.trim();
  const p = new URLSearchParams({ api_key: CONFIG.GIPHY_KEY, limit: '24', rating: 'pg-13', lang: 'es' });
  let ep = 'gifs/trending';
  if (state.pickKind === 'memes') { p.set('q', (q ? q + ' ' : '') + 'meme'); ep = 'gifs/search'; }
  else if (q) { p.set('q', q); ep = 'gifs/search'; }
  try {
    const j = await (await fetch(`https://api.giphy.com/v1/${ep}?${p}`)).json();
    g.innerHTML = (j.data || []).map(x => `<button type="button" data-a="gif" data-u="${esc(x.images.fixed_height.url)}"><img src="${esc(x.images.fixed_height_small?.url || x.images.fixed_height.url)}" loading="lazy" alt=""></button>`).join('') || '<p class="muted">Sin resultados.</p>';
  } catch (e) { g.innerHTML = '<p class="muted">No se pudieron cargar.</p>'; }
}
$('#pickForm').onsubmit = e => { e.preventDefault(); loadGifs(); };

/* ---------- Avisos ---------- */
const tsMs = x => x?.toMillis ? x.toMillis() : Date.now();
function subNotices() {
  const q = query(collection(db, 'notices'), where('to', 'array-contains-any', [state.user.uid, 'all']));
  unsubs.push(onSnapshot(q, snap => {
    state.notices = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => tsMs(b.createdAt) - tsMs(a.createdAt));
    renderNotices(); renderBadge();
  }, e => console.error(e)));
}
function renderNotices() {
  $('#v-notices').innerHTML = '<h2>Avisos</h2>' + (state.notices.length ? state.notices.map(n => `
    <div class="card"><b>${esc(n.title)}</b><p style="white-space:pre-wrap;margin:6px 0">${esc(n.text)}</p>
    <span class="tag">${esc(n.byName || 'Administrador')} · ${esc(n.createdAt?.toDate ? n.createdAt.toDate().toLocaleString('es', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '')}</span></div>`).join('')
    : '<div class="card muted">No tenés avisos.</div>');
}
function renderBadge() {
  let seen = 0; try { seen = Number(localStorage.getItem(state.seenKey)) || 0; } catch (e) {}
  const n = state.tab === 'notices' ? 0 : state.notices.filter(x => x.createdAt && tsMs(x.createdAt) > seen).length;
  const b = $('#tab-notices'); if (!b) return;
  b.querySelector('.badge')?.remove();
  if (n) b.insertAdjacentHTML('beforeend', `<i class="badge">${n}</i>`);
}

/* ---------- Notas ---------- */
function subNotes() {
  const q = query(collection(db, 'users', state.user.uid, 'notes'), orderBy('updatedAt', 'desc'));
  unsubs.push(onSnapshot(q, snap => {
    state.notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.editing === null) renderNotes();
  }, e => console.error(e)));
}
function renderNotes() {
  const v = $('#v-notes');
  if (state.editing !== null) {
    const n = state.notes.find(x => x.id === state.editing) || { title: '', body: '' };
    v.innerHTML = `<h2>${state.editing === 'new' ? 'Nueva nota' : 'Editar nota'}</h2>
      <input id="nTitle" placeholder="Título" value="${esc(n.title)}">
      <textarea id="nBody" placeholder="Escribí tu nota…" style="min-height:260px">${esc(n.body)}</textarea>
      <div class="row"><button class="btn" data-a="nsave">Guardar</button><button class="btn sec" data-a="nback">Volver</button>
      ${state.editing !== 'new' ? '<button class="btn dan" data-a="ndel">Eliminar</button>' : ''}</div>`;
    return;
  }
  v.innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Mis notas</h2><button class="btn sm" data-a="nnew">+ Nueva</button></div>` +
    (state.notes.length ? state.notes.map(n => `<div class="card" data-a="nopen" data-id="${n.id}" style="cursor:pointer"><b>${esc(n.title || 'Sin título')}</b>
      <p class="muted" style="margin:4px 0 0;white-space:pre-wrap;max-height:3.4em;overflow:hidden">${esc((n.body || '').slice(0, 160))}</p></div>`).join('')
      : '<div class="card muted">Todavía no tenés notas.</div>');
}

/* ---------- Administración ---------- */
function subAdmin() {
  unsubs.push(onSnapshot(collection(db, 'users'), snap => {
    state.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAdmin();
  }, e => console.error(e)));
  unsubs.push(onSnapshot(query(collection(db, 'notices'), orderBy('createdAt', 'desc')), snap => {
    state.allNotices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAdmin();
  }, e => console.error(e)));
}
function renderAdmin() {
  const v = $('#v-admin');
  if (v.contains(document.activeElement) && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return; // no pisar lo que se está escribiendo
  const pend = state.users.filter(u => u.status === 'pending');
  const appr = state.users.filter(u => u.status === 'approved');
  const rej = state.users.filter(u => u.status === 'rejected');
  const nameOf = id => (state.users.find(u => u.id === id) || {}).name || '?';
  v.innerHTML = `<h2>Administración</h2>
    <div class="card"><h3>Solicitudes pendientes (${pend.length})</h3>
      ${pend.map(u => `<div class="row" style="justify-content:space-between;padding:6px 0"><div><b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)}</span></div>
        <div class="row"><button class="btn sm" data-a="uset" data-id="${u.id}" data-s="approved">Aprobar</button><button class="btn dan sm" data-a="uset" data-id="${u.id}" data-s="rejected">Rechazar</button></div></div>`).join('') || '<span class="muted">Ninguna.</span>'}
    </div>
    <div class="card"><h3>Usuarios (${appr.length})</h3>
      ${appr.map(u => `<div class="row" style="justify-content:space-between;padding:6px 0"><div><b>${esc(u.name)}</b> ${u.role === 'admin' ? '<span class="tag">admin</span>' : ''}<br><span class="muted">${esc(u.email)}</span></div>
        ${u.id !== state.user.uid ? `<button class="btn dan sm" data-a="uset" data-id="${u.id}" data-s="rejected">Quitar acceso</button>` : ''}</div>`).join('')}
      ${rej.length ? `<p class="muted">Rechazados: ${rej.map(u => esc(u.name)).join(', ')} <button class="btn sec sm" data-a="restore">Ver para reactivar</button></p>` : ''}
    </div>
    <div class="card"><h3>Nuevo aviso</h3>
      <input id="nvTitle" placeholder="Título">
      <textarea id="nvText" placeholder="Mensaje" style="min-height:90px"></textarea>
      <div class="chk"><input type="checkbox" id="nvAll" checked data-a="nvall"><label for="nvAll">Para todos</label></div>
      <div id="nvUsers" class="hidden">${appr.map(u => `<div class="chk"><input type="checkbox" class="nvu" value="${u.id}" id="u_${u.id}"><label for="u_${u.id}">${esc(u.name)}</label></div>`).join('')}</div>
      <button class="btn" data-a="sendnotice" style="width:100%;margin-top:8px">Enviar aviso</button>
    </div>
    <div class="card"><h3>Avisos enviados</h3>
      ${state.allNotices.map(n => `<div style="padding:6px 0;border-top:1px solid var(--bd)"><b>${esc(n.title)}</b> <span class="tag">${n.to.includes('all') ? 'todos' : esc(n.to.map(nameOf).join(', '))}</span>
        <button class="btn dan sm" style="float:right" data-a="delnotice" data-id="${n.id}">Borrar</button><p class="muted" style="margin:2px 0;white-space:pre-wrap">${esc(n.text)}</p></div>`).join('') || '<span class="muted">Ninguno.</span>'}
    </div>`;
}

/* ---------- Eventos ---------- */
document.addEventListener('change', e => {
  if (e.target.id === 'nvAll') $('#nvUsers').classList.toggle('hidden', e.target.checked);
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, d = b.dataset;
  try {
    switch (a) {
      case 'logout': await signOut(auth); break;
      case 'tab': setTab(d.t); break;
      case 'weather': loadWeather(); break;
      case 'scope':
        state.newsScope = d.s;
        $('#sLocal').classList.toggle('sec', d.s !== 'local'); $('#sWorld').classList.toggle('sec', d.s !== 'world');
        loadNews(); break;
      case 'share': { const x = state.articles[Number(d.i)]; if (x) share(x.title, x.url); break; }
      case 'copy': try { await navigator.clipboard.writeText(d.url); b.textContent = '¡Copiado!'; } catch (er) { prompt('Copiá el enlace:', d.url); } break;
      case 'closesheet': $('#sheet').classList.add('hidden'); break;
      case 'picker': $('#picker').classList.toggle('hidden'); if (!$('#picker').classList.contains('hidden')) renderPicker(); break;
      case 'ptab': state.pickKind = d.k; renderPicker(); break;
      case 'emoji': $('#chatIn').value += d.e; $('#chatIn').focus(); break;
      case 'gif': await sendMsg({ type: 'gif', url: d.u }); $('#picker').classList.add('hidden'); break;
      case 'imgurl': { const u = prompt('Pegá el enlace de una imagen (https://…)'); if (u && safeUrl(u.trim())) await sendMsg({ type: 'img', url: u.trim() }); else if (u) alert('El enlace debe empezar con https://'); break; }
      case 'delmsg': if (confirm('¿Borrar este mensaje?')) await deleteDoc(doc(db, 'messages', d.id)); break;
      case 'nnew': state.editing = 'new'; renderNotes(); break;
      case 'nopen': state.editing = d.id; renderNotes(); break;
      case 'nback': state.editing = null; renderNotes(); break;
      case 'nsave': {
        const data = { title: $('#nTitle').value.trim(), body: $('#nBody').value, updatedAt: serverTimestamp() };
        const col = collection(db, 'users', state.user.uid, 'notes');
        if (state.editing === 'new') await addDoc(col, data); else await updateDoc(doc(col, state.editing), data);
        state.editing = null; renderNotes(); break;
      }
      case 'ndel': if (confirm('¿Eliminar esta nota?')) { await deleteDoc(doc(db, 'users', state.user.uid, 'notes', state.editing)); state.editing = null; renderNotes(); } break;
      case 'uset': await updateDoc(doc(db, 'users', d.id), { status: d.s }); break;
      case 'restore': { const r = state.users.filter(u => u.status === 'rejected'); if (r.length && confirm('¿Reactivar a ' + r.map(u => u.name).join(', ') + '?')) for (const u of r) await updateDoc(doc(db, 'users', u.id), { status: 'approved' }); break; }
      case 'sendnotice': {
        const title = $('#nvTitle').value.trim(), text = $('#nvText').value.trim();
        const all = $('#nvAll').checked;
        const to = all ? ['all'] : [...document.querySelectorAll('.nvu:checked')].map(x => x.value);
        if (!title || !text) return alert('Completá título y mensaje.');
        if (!to.length) return alert('Elegí al menos un usuario.');
        await addDoc(collection(db, 'notices'), { title, text, to, byName: state.me.name, createdAt: serverTimestamp() });
        $('#nvTitle').value = ''; $('#nvText').value = ''; renderAdmin(); break;
      }
      case 'delnotice': if (confirm('¿Borrar este aviso?')) await deleteDoc(doc(db, 'notices', d.id)); break;
    }
  } catch (err) { console.error(err); alert('No se pudo completar la acción.'); }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
